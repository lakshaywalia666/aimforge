<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimForge 3D Trainer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }
        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        /* Simple CSS Crosshair */
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        #crosshair::before { top: 9px; left: 0; width: 20px; height: 2px; }
        #crosshair::after { top: 0; left: 9px; width: 2px; height: 20px; }
        
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            z-index: 5;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "/static/vendor/three/three.module.js",
                "three/addons/": "/static/vendor/three/"
            }
        }
    </script>
</head>
<body>

    <div id="ui">Targets Destroyed: <span id="score">0</span></div>
    
    <div id="crosshair" style="display: none;"></div>

    <div id="blocker">
        <h1 style="font-size: 40px; text-transform: uppercase;">AimForge</h1>
        <p style="font-size: 20px;">Choose a control mode</p>
        <p style="color:#ccc;text-align:center;padding:0 20px">WASD to move · Mouse to look in captured mode<br>Arrow keys to look in keyboard mode · Space or Fire to shoot</p>
        <button id="play-captured" style="padding:14px 22px;margin:6px;border:0;border-radius:10px;cursor:pointer">Play with captured mouse</button>
        <button id="play-unlocked" style="padding:14px 22px;margin:6px;border:0;border-radius:10px;cursor:pointer">Play with keyboard controls</button>
    </div>

    <a href="https://lakshaywalia.com/projects.html" style="position:absolute;right:18px;top:20px;z-index:20;color:white;text-shadow:0 1px 3px black">← All projects</a>
    <button id="fire-button" hidden style="position:absolute;right:22px;bottom:22px;z-index:15;padding:18px 28px;border:0;border-radius:12px;background:#c4f76b;color:#102008;font-weight:bold">Fire</button>
    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/PointerLockControls.js';

        // 1. Scene Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue
        scene.fog = new THREE.Fog(0x87ceeb, 0, 750);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.y = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Lighting
        const hemiLight = new THREE.HemisphereLight(0xeeeeff, 0x777788, 0.75);
        hemiLight.position.set(0.5, 1, 0.75);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(20, 100, 10);
        scene.add(dirLight);

        // 3. Environment (Floor)
        const floorGeometry = new THREE.PlaneGeometry(2000, 2000, 10, 10);
        const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x223322 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 4. Targets (Enemies)
        const targets = [];
        const boxGeometry = new THREE.BoxGeometry(10, 10, 10);
        const boxMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 }); // Red targets

        for (let i = 0; i < 50; i++) {
            const box = new THREE.Mesh(boxGeometry, boxMaterial);
            box.position.x = Math.floor(Math.random() * 20 - 10) * 20;
            box.position.y = 5;
            box.position.z = Math.floor(Math.random() * 20 - 10) * 20;
            scene.add(box);
            targets.push(box);
        }

        const practiceTarget = new THREE.Mesh(boxGeometry, boxMaterial.clone());
        practiceTarget.position.set(0,10,-45);scene.add(practiceTarget);targets.push(practiceTarget);

        // 5. Controls & Movement
        const controls = new PointerLockControls(camera, document.body);
        const blocker = document.getElementById('blocker');
        const crosshair = document.getElementById('crosshair');

        let keyboardMode = false;
        const fireButton = document.getElementById('fire-button');
        document.getElementById('play-captured').addEventListener('click', () => { keyboardMode=false;controls.lock(); });
        document.getElementById('play-unlocked').addEventListener('click', () => {
            keyboardMode=true;blocker.style.display='none';crosshair.style.display='block';fireButton.hidden=false;
        });
        document.addEventListener('pointerlockerror', () => {
            blocker.style.display='flex';crosshair.style.display='none';
            document.getElementById('play-unlocked').textContent='Mouse capture unavailable — play with keyboard controls';
        });
        
        controls.addEventListener('lock', () => {
            blocker.style.display = 'none';
            fireButton.hidden=false;
            crosshair.style.display = 'block';
        });
        
        controls.addEventListener('unlock', () => {
            blocker.style.display = 'flex';
            crosshair.style.display = 'none';
            fireButton.hidden=true;
            Object.keys(moveState).forEach(key=>moveState[key]=false);velocity.set(0,0,0);
        });

        scene.add(controls.getObject());

        const moveState = { forward: false, backward: false, left: false, right: false };
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        document.addEventListener('keydown', (event) => {
            if (keyboardMode) {
                if (event.code==='Escape') { keyboardMode=false;blocker.style.display='flex';crosshair.style.display='none';fireButton.hidden=true;Object.keys(moveState).forEach(key=>moveState[key]=false);velocity.set(0,0,0);return; }
                if(event.code.startsWith('Arrow')) {
                    event.preventDefault();camera.rotation.order='YXZ';
                    if(event.code==='ArrowLeft')camera.rotation.y+=.045;
                    if(event.code==='ArrowRight')camera.rotation.y-=.045;
                    if(event.code==='ArrowUp')camera.rotation.x=Math.min(1.3,camera.rotation.x+.045);
                    if(event.code==='ArrowDown')camera.rotation.x=Math.max(-1.3,camera.rotation.x-.045);
                    return;
                }
                if(event.code==='Space'){event.preventDefault();shoot();return;}
            }
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveState.forward = true; break;
                case 'ArrowLeft': case 'KeyA': moveState.left = true; break;
                case 'ArrowDown': case 'KeyS': moveState.backward = true; break;
                case 'ArrowRight': case 'KeyD': moveState.right = true; break;
            }
        });

        document.addEventListener('keyup', (event) => {
            switch (event.code) {
                case 'ArrowUp': case 'KeyW': moveState.forward = false; break;
                case 'ArrowLeft': case 'KeyA': moveState.left = false; break;
                case 'ArrowDown': case 'KeyS': moveState.backward = false; break;
                case 'ArrowRight': case 'KeyD': moveState.right = false; break;
            }
        });

        // 6. Shooting Mechanics
        const raycaster = new THREE.Raycaster();
        let score = 0;

        function shoot() {
            if (!controls.isLocked && !keyboardMode) return;

            // Cast ray from center of screen
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(targets.filter(target=>!target.userData.hit));

            if (intersects.length > 0) {
                const hitTarget = intersects[0].object;
                hitTarget.userData.hit=true;
                hitTarget.material.color.setHex(0x00ff00); // Turn green briefly
                
                // Remove target after a tiny delay
                setTimeout(() => {
                    scene.remove(hitTarget);
                    targets.splice(targets.indexOf(hitTarget), 1);
                }, 100);

                score++;
                document.getElementById('score').innerText = score;
            }
        }
        document.addEventListener('mousedown',event=>{if(event.button===0&&!event.target.closest('button,a'))shoot();});
        fireButton.addEventListener('click',shoot);

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 7. Main Game Loop
        let prevTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();

            if (controls.isLocked === true || keyboardMode) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta; // Friction
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveState.forward) - Number(moveState.backward);
                direction.x = Number(moveState.right) - Number(moveState.left);
                direction.normalize();

                const speed = 400.0;
                if (moveState.forward || moveState.backward) velocity.z -= direction.z * speed * delta;
                if (moveState.left || moveState.right) velocity.x -= direction.x * speed * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
